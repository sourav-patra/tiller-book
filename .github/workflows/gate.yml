# Required checks for every pull request. pull_request_target takes this file from main, so a pull request that
# edits it changes nothing that runs on itself. Only the tests job runs pull request code, and it holds no secret.
name: gate
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  floor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Install tlb from main
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet ./trusted
      - name: Confirm the checkout is the pull request head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git -C pr rev-parse HEAD)" = "$HEAD_SHA"
      # -I keeps the tiller_book folder in the pull request off the import path, so the code from main runs.
      - name: Path scope
        working-directory: pr
        run: '"$RUNNER_TEMP/venv/bin/python" -I -m tiller_book.checks.floor.path_scope'
      - name: Receipt
        working-directory: pr
        run: '"$RUNNER_TEMP/venv/bin/python" -I -m tiller_book.checks.floor.receipt'
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Install tlb from main and gitleaks
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet ./trusted
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # The deny-list is a secret. This job only reads the pull request as data; it never runs its code.
      - name: Deny-list, identities and leak scan
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
        run: |
          printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/denylist.txt"
          "$RUNNER_TEMP/venv/bin/python" -I -m tiller_book.cli release scan --denylist "$RUNNER_TEMP/denylist.txt" --repo pr
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run the pull request's tests
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -e ".[test]"
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q
