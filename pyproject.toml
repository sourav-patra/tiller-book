[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiller-book"
version = "0.1.0.dev0"
description = "Signed plans, independent review and receipts for agentic coding work."
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tlb = "tiller_book.cli:main"

[tool.setuptools.packages.find]
include = ["tiller_book*"]
